name: Node.js Package

on:
  release:
    types: [created]
  # Lets a failed publish be retried without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # 22 is the floor declared in engines; the suite must pass there.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token npm exchanges for publish rights.
      # Without it the publish fails with no credential at all.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Node 24
      # ships npm 11.16+; Node 22 still ships npm 10 and cannot do OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      # No NODE_AUTH_TOKEN: npmjs.org authenticates this workflow as a trusted
      # publisher over OIDC, which requires a trusted publisher registered
      # against this filename (`npm trust github --file publish.yml`). Without
      # that registration the exchange is refused and the publish fails with a
      # bare 404. Provenance attestations are signed automatically.
      #
      # Re-running for a version already on the registry is not a failure: the
      # version is present, which is the end state we want. Match on the message
      # rather than a status code — npm raises this one client-side with no code,
      # and the codes that do cover it (403) also cover a genuine loss of publish
      # rights, which must stay loud.
      - name: Publish to npm
        run: |
          if output=$(npm publish 2>&1); then
            echo "$output"
          else
            echo "$output"
            grep -qi 'cannot publish over' <<<"$output" || exit 1
            echo "::notice::Version already published to npm; nothing to do."
          fi

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      # GitHub Packages takes the workflow's own token; no 2FA is involved.
      #
      # Same tolerance as the npm job, matching the same phrase: GitHub Packages
      # answers "Cannot publish over existing version", npm says "You cannot
      # publish over the previously published versions". Anything else fails.
      - name: Publish to GitHub Packages
        run: |
          if output=$(npm publish 2>&1); then
            echo "$output"
          else
            echo "$output"
            grep -qi 'cannot publish over' <<<"$output" || exit 1
            echo "::notice::Version already published to GitHub Packages; nothing to do."
          fi
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
