name: Node.js Package

on:
  release:
    types: [created]
  # Lets a failed publish be retried without cutting a new release.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # 22 is the floor declared in engines; the suite must pass there.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token npm exchanges for publish rights.
      # Without it the publish fails with no credential at all.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Node 24
      # ships npm 11.16+; Node 22 still ships npm 10 and cannot do OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      # No NODE_AUTH_TOKEN: npmjs.org authenticates this workflow as a trusted
      # publisher over OIDC. Provenance attestations are generated automatically
      # for a public package built from a public repository.
      #
      # setup-node's registry-url writes an .npmrc pinning _authToken to the
      # placeholder XXXXX-XXXXX-XXXXX-XXXXX when no token is in the env. npm is
      # meant to override that once the OIDC exchange succeeds; if the exchange
      # is refused it falls back to the placeholder and the registry answers 404.
      # Verbose logging shows which of the two happened.
      - run: npm publish --loglevel verbose

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      # GitHub Packages takes the workflow's own token; no 2FA is involved.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
